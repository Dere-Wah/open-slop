# Count the audience vote on a story pull request and publish it as a commit
# status (`story/quorum`). The vote is GitHub's own review button: anyone can
# submit an "Approve" review on a public repository, GitHub just does not count
# it toward its native required-reviews rule (that only counts write access,
# and Open Slop gives write access to no one). So this workflow counts them.
#
# It runs from the default branch (`story`): on every comment (so `/block`
# works and any comment refreshes the tally), on every push to a pull request
# (so the tally resets and auto-merge is re-armed), and on a sweep every five
# minutes. It cannot run on the review event itself: `pull_request_review`
# from a fork gets a read-only token, and every contributor here is a fork. So
# an approval shows up in the tally within a few minutes, or at once when
# anyone comments. It does not merge anything by hand: it sets the status and
# keeps GitHub's auto-merge armed, and auto-merge fires once story/validate
# and story/quorum are both green.
#
# WHAT COUNTS — read before editing:
#   An approval counts only for the commit it was given on: the review's
#   `commit_id` must equal the pull request's current head. GitHub records
#   that server-side, so a push after the approvals were gathered drops them
#   all, and nothing a contributor writes can carry an old approval onto new
#   content. A reviewer's latest review on the head decides their vote —
#   "Approve" is yes, "Request changes" is no — and a dismissed review is no.
#
# THE WAIT ANCHOR:
#   The wait after the last push is NOT read from the commit: committer dates
#   are set by whoever commits. It is read from the first commit status this
#   repository's bot posted on the head sha (story/validate or story/quorum),
#   which GitHub timestamps server-side the moment the push triggered a run.
#   So a placeholder opened early and filled in late still waits.
#
# The numbers (QUORUM, COOLING_OFF_MINUTES, MIN_ACCOUNT_AGE_DAYS) live only
# here. The docs describe the mechanism and point at the bot's comment for the
# current values, so changing them is a one-line edit.
name: story-quorum

on:
  issue_comment:
    types: [created, edited, deleted]
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [story]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  statuses: write
  pull-requests: write
  issues: write

concurrency:
  group: story-quorum-${{ github.event.issue.number || github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  quorum:
    # Comments on plain issues are ignored; pull-request threads, pull-request
    # pushes, and the scheduled sweep run.
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const QUORUM = 2;
            const COOLING_OFF_MINUTES = 5;
            const MIN_ACCOUNT_AGE_DAYS = 30;
            const BLOCK = /^\/block\b/i;
            const UNBLOCK = /^\/unblock\b/i;
            const CAN_BLOCK = new Set(["OWNER", "MEMBER", "COLLABORATOR"]);
            const BOT = "github-actions[bot]";
            const ANCHOR_CONTEXTS = new Set(["story/validate", "story/quorum"]);
            const MARKER = "<!-- open-slop:quorum -->";
            // The screenshot strip lives on the code branch; the story branch
            // holds no binaries.
            const HOW_TO_APPROVE = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/code/assets/how-to-approve.png`;

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Account age is looked up once per login per run.
            const accountCreated = new Map();
            async function eligible(login) {
              if (!accountCreated.has(login)) {
                try {
                  const { data: user } = await github.rest.users.getByUsername({ username: login });
                  accountCreated.set(login, user.type === "User" ? new Date(user.created_at).getTime() : null);
                } catch (error) {
                  core.warning(`could not look up @${login}: ${error.message}`);
                  accountCreated.set(login, null);
                }
              }
              const created = accountCreated.get(login);
              if (created === null) return false;
              return Date.now() - created >= MIN_ACCOUNT_AGE_DAYS * 86_400_000;
            }

            // When the head sha was pushed, as GitHub saw it (see the header).
            async function anchorFor(sha) {
              const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
                owner, repo, ref: sha, per_page: 100,
              });
              let earliest = Infinity;
              for (const s of statuses) {
                if (s.creator?.login !== BOT || !ANCHOR_CONTEXTS.has(s.context)) continue;
                earliest = Math.min(earliest, new Date(s.created_at).getTime());
              }
              return earliest === Infinity ? Date.now() : earliest;
            }

            async function armAutoMerge(pr) {
              if (pr.auto_merge) return;
              try {
                await github.graphql(
                  `mutation($id: ID!) {
                     enablePullRequestAutoMerge(input: { pullRequestId: $id, mergeMethod: SQUASH }) {
                       clientMutationId
                     }
                   }`,
                  { id: pr.node_id },
                );
              } catch (error) {
                // Auto-merge cannot be armed on a pull request that is already
                // clean to merge; that is the one case where merging by hand
                // is exactly what auto-merge would have done.
                if (/clean status/i.test(error.message)) {
                  try {
                    await github.rest.pulls.merge({
                      owner, repo, pull_number: pr.number, merge_method: "squash",
                    });
                    return;
                  } catch (mergeError) {
                    core.warning(`merge of #${pr.number} refused: ${mergeError.message}`);
                    return;
                  }
                }
                core.warning(
                  `could not arm auto-merge on #${pr.number} (is 'Allow auto-merge' on?): ${error.message}`,
                );
              }
            }

            async function evaluate(number) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
              if (pr.state !== "open" || pr.base.ref !== "story") return;

              const head = pr.head.sha;
              const anchor = await anchorFor(head);

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: number, per_page: 100,
              });

              // A maintainer's latest /block or /unblock decides the block; it
              // survives pushes.
              let blocked = false;
              for (const c of comments) {
                if (!c.body || !c.user || c.user.type === "Bot") continue;
                if (!CAN_BLOCK.has(c.author_association)) continue;
                if (BLOCK.test(c.body)) blocked = true;
                else if (UNBLOCK.test(c.body)) blocked = false;
              }

              // The vote: each reviewer's LATEST review given on the current
              // head decides — Approve is yes, Request changes is no, and a
              // dismissed review is no. Reviews on an older commit are not
              // votes for this one. `listReviews` returns them in submission
              // order.
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner, repo, pull_number: number, per_page: 100,
              });
              const votes = new Map();
              for (const r of reviews) {
                if (!r.user || r.user.type === "Bot") continue;
                if (r.user.login === pr.user.login) continue; // not the author
                if (r.commit_id !== head) continue;
                if (r.state === "APPROVED") votes.set(r.user.login, true);
                else if (r.state === "CHANGES_REQUESTED" || r.state === "DISMISSED") votes.set(r.user.login, false);
              }
              const approvers = [];
              const tooNew = [];
              for (const [login, up] of votes) {
                if (!up) continue;
                if (await eligible(login)) approvers.push(login);
                else tooNew.push(login);
              }
              const count = approvers.length;

              const cooledAt = anchor + COOLING_OFF_MINUTES * 60_000;
              const cooled = Date.now() >= cooledAt;
              const minutesLeft = Math.max(1, Math.ceil((cooledAt - Date.now()) / 60_000));

              let state, description;
              if (blocked) {
                state = "failure";
                description = "blocked by a maintainer";
              } else if (count >= QUORUM && cooled) {
                state = "success";
                description = `${count}/${QUORUM} approvals — canon`;
              } else if (count >= QUORUM) {
                state = "pending";
                description = `${count}/${QUORUM} approvals — merges in ~${minutesLeft} min`;
              } else {
                state = "pending";
                description = `${count}/${QUORUM} approvals`;
              }

              await github.rest.repos.createCommitStatus({
                owner, repo, sha: head, context: "story/quorum", state, description,
              });

              const headline = blocked
                ? "🚫 **Blocked by a maintainer.** It will not merge until they `/unblock` it."
                : count >= QUORUM && cooled
                  ? "✅ **Enough approvals.** It merges as soon as the format check is green."
                  : count >= QUORUM
                    ? `⏳ **Enough approvals.** Merges in about ${minutesLeft} minute(s).`
                    : `🗳️ **Need ${QUORUM - count} more approval(s).** Anyone can vote — see below.`;

              const lines = [
                MARKER,
                `## 🎬 Audience vote: ${count}/${QUORUM}`,
                "",
                headline,
                "",
                approvers.length
                  ? `**Approved by:** ${approvers.map((u) => "@" + u).join(", ")}`
                  : "_No approvals yet._",
                tooNew.length
                  ? `_Not counted (account younger than ${MIN_ACCOUNT_AGE_DAYS} days): ${tooNew.map((u) => "@" + u).join(", ")}_`
                  : null,
                "",
                "### 👉 How to approve",
                "It is a normal GitHub review, three clicks:",
                "",
                "1. Open the **Files changed** tab at the top of this pull request.",
                "2. Click the green **Submit review** button on the right.",
                "3. Pick **Approve**, then **Submit review**.",
                "",
                `<img src="${HOW_TO_APPROVE}" alt="1: the Files changed tab. 2: the Submit review button. 3: choose Approve." width="900">`,
                "",
                "### 📏 The rules",
                `- 👤 Anyone with a GitHub account older than **${MIN_ACCOUNT_AGE_DAYS} days** can approve. Comments do not count as votes.`,
                `- 📌 An approval is for the commit it was given on. A new push clears the votes and restarts the **${COOLING_OFF_MINUTES}-minute** wait.`,
                "- ↩️ To withdraw, submit a **Request changes** review.",
                "- 🔄 This tally refreshes every few minutes, or at once when anyone comments.",
              ].filter((line) => line !== null);
              const body = lines.join("\n");

              const existing = comments.find(
                (c) => c.user?.login === BOT && c.body && c.body.includes(MARKER),
              );
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
              }

              // GitHub drops auto-merge when someone without write access
              // pushes, and every contributor here is someone without write
              // access. Keep it armed on every pass; it fires only when both
              // required checks are green.
              if (!blocked) await armAutoMerge(pr);
            }

            if (context.eventName === "schedule") {
              const prs = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: "open", base: "story", per_page: 100,
              });
              for (const pr of prs) {
                try {
                  await evaluate(pr.number);
                } catch (error) {
                  core.warning(`#${pr.number}: ${error.message}`);
                }
              }
            } else if (context.eventName === "pull_request_target") {
              await evaluate(context.payload.pull_request.number);
            } else {
              await evaluate(context.payload.issue.number);
            }
