# Greet a new story pull request. Runs from the default branch (`story`).
#
# Arming auto-merge is story-quorum's job (it does so on open and re-does it
# after every push, since GitHub drops auto-merge when a contributor without
# write access pushes). This workflow only says hello and explains the rules.
name: story-welcome

on:
  pull_request_target:
    types: [opened]
    branches: [story]

permissions:
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const MARKER = "<!-- open-slop:welcome -->";
            const skills = `https://github.com/${owner}/${repo}/blob/story/skills`;

            const body = [
              MARKER,
              `### Welcome to Open Slop, @${pr.user.login}`,
              "",
              "You are writing a scene of a film that anyone can write, and the audience approves.",
              "",
              "1. A format check runs automatically and comments what it found.",
              "2. Anyone whose GitHub account is at least 30 days old can vote it in by commenting `/approve`. **Three approvals** and a six-hour cooling-off window counted from your last push, and it merges on its own — no maintainer needed. Pushing a new commit resets both.",
              "3. The projector snapshots this branch about a minute of film before each screening starts. Once merged, your scene is on air at [openslop.live](https://openslop.live) from the first screening snapshotted after the merge, credited to you.",
              "",
              `A pull request may only touch episode files and \`README.md\` / \`STYLE.md\` / \`LICENSE\`. See [\`skills/how-approval-works\`](${skills}/how-approval-works/SKILL.md) and [\`skills/writing-a-scene\`](${skills}/writing-a-scene/SKILL.md).`,
            ].join("\n");

            await github.rest.issues.createComment({
              owner, repo, issue_number: pr.number, body,
            });
