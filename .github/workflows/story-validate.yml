# Gate a story pull request on the episode format, and re-check the branch tip
# after every merge.
#
# SECURITY INVARIANT — read before editing:
#   This workflow NEVER executes a single line from the pull request. It checks
#   the PR head out as DATA (into ./story-pr) and reads those files as text with
#   the validator, which is checked out separately from the `code` branch (into
#   ./tools). There is no `pip install`, no build, no script from the PR. Keep it
#   that way: the moment this runs PR code, a contributor can rewrite the check
#   that judges their own change.
#
#   Untrusted values (changed filenames, the validator's report) are passed
#   through files and environment variables, never interpolated with ${{ }} into
#   a shell line or an inline script — that interpolation would be a
#   command-injection vector under pull_request_target's write-scoped token.
#
# It runs from the default branch (`story`) via pull_request_target, so the copy
# that runs is always this trusted one, not the PR's.
#
# The `push` job is the second line: two pull requests that each validate on
# their own can merge into a film that does not (one adds `0040-x.md`, the other
# deletes the `0030` it continues from). The projector holds the last good film
# when that happens; this job opens an issue so someone fixes the branch.
name: story-validate

on:
  pull_request_target:
    branches: [story]
  push:
    branches: [story]

permissions:
  contents: read
  statuses: write
  pull-requests: write
  issues: write

concurrency:
  group: story-validate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  pull-request:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the pull request's files (data only, never executed)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: story-pr
          persist-credentials: false
          # actions/checkout refuses a fork's head under pull_request_target
          # unless told so, because most workflows go on to run what they
          # fetched. This one does not: story-pr is read by a validator that
          # comes from a pinned commit of the code branch, and no step runs,
          # imports, or installs anything from story-pr. That is what makes
          # the opt-in safe here; keep it true only while that stays true.
          allow-unsafe-pr-checkout: true

      - name: Fetch the validator from the code branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Pinned to a code-branch commit so the validator cannot drift from
          # the reviewed one. Move this sha deliberately, after the change to
          # story-tools/ has landed on `code` (see the code branch's
          # skills/story-ci-and-approval).
          ref: 85a3e511f9c269dcdab7fa0e144afa5b85498924
          path: tools
          sparse-checkout: story-tools
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: List the pull request's changed files
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            // status<TAB>path<TAB>previous-path, one per line, so the
            // validator judges a rename or a deletion as what it is. Written
            // to a file, never into a shell line: a crafted filename cannot
            // inject a command. A tab or newline in a name is refused here.
            const clean = (s) => (s ?? "").replace(/[\t\r\n]/g, "\uFFFD");
            const lines = files.map((f) =>
              [clean(f.status), clean(f.filename), clean(f.previous_filename)].join("\t"),
            );
            require("fs").writeFileSync("changed.tsv", lines.join("\n") + "\n");

      - name: Validate the film
        id: validate
        run: |
          set +e
          python tools/story-tools/validate.py story-pr --changed-file changed.tsv --report > report.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat report.txt

      # The doctor reads the same files as text and works out the smallest
      # edit that would make each one pass: a header written the one way the
      # format reads, a prompt cut to the cap at its last full sentence, a
      # missing fence. Its output is JSON, rendered below as ```suggestion```
      # review comments the author commits with one click. It never writes to
      # the branch; a failure here only means no suggestions, so it must not
      # fail the check.
      - name: Work out fixes to suggest
        if: steps.validate.outputs.code == '1'
        continue-on-error: true
        run: |
          python tools/story-tools/doctor.py story-pr --changed-file changed.tsv > doctor.json

      - name: Post status and comment
        if: always()
        uses: actions/github-script@v7
        env:
          VALIDATE_CODE: ${{ steps.validate.outputs.code }}
        with:
          script: |
            const fs = require("fs");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const doctorMarker = "<!-- open-slop:doctor -->";

            // ------------------------------------------------ the doctor's review
            // Yesterday's suggestions describe yesterday's file. Drop the bot's
            // own doctor comments before posting today's, so a contributor never
            // sees two answers.
            const oldReviewComments = await github.paginate(github.rest.pulls.listReviewComments, {
              owner, repo, pull_number, per_page: 100,
            });
            for (const c of oldReviewComments) {
              if (c.user?.login === "github-actions[bot]" && c.body && c.body.includes(doctorMarker)) {
                await github.rest.pulls.deleteReviewComment({ owner, repo, comment_id: c.id }).catch(() => {});
              }
            }

            let doctor = { files: [] };
            try {
              if (fs.existsSync("doctor.json")) doctor = JSON.parse(fs.readFileSync("doctor.json", "utf8"));
            } catch (_) {
              doctor = { files: [] };
            }
            const suggestions = doctor.files.flatMap((f) => f.suggestions ?? []);
            const notes = doctor.files.flatMap((f) => f.notes ?? []);
            const remaining = doctor.files.flatMap((f) => (f.remaining ?? []).map((m) => `\`${f.path}\` — ${m}`));

            // A suggestion block replaces the commented lines with its body; an
            // empty body deletes them. Prose can hold backticks, so the fence is
            // one longer than the longest run inside.
            function suggestionBody(s) {
              const runs = s.replacement.match(/`+/g) ?? [];
              const fence = "`".repeat(Math.max(3, ...runs.map((r) => r.length + 1)));
              const block = s.replacement === "" ? `${fence}suggestion\n${fence}` : `${fence}suggestion\n${s.replacement}\n${fence}`;
              return `${s.why}\n\n${block}\n${doctorMarker}`;
            }

            let posted = 0;
            let inlineFailed = false;
            if (suggestions.length) {
              const comments = suggestions.map((s) => {
                const c = { path: s.path, line: s.end_line, side: "RIGHT", body: suggestionBody(s) };
                if (s.start_line < s.end_line) Object.assign(c, { start_line: s.start_line, start_side: "RIGHT" });
                return c;
              });
              try {
                await github.rest.pulls.createReview({
                  owner, repo, pull_number,
                  commit_id: context.payload.pull_request.head.sha,
                  event: "COMMENT",
                  body: `🩺 ${comments.length} suggested fix${comments.length === 1 ? "" : "es"} below. Each is a one-click commit (**Commit suggestion**, or **Add suggestion to batch** to take several at once); take the ones you agree with. Committing one restarts the approval clock. ${doctorMarker}`,
                  comments,
                });
                posted = comments.length;
              } catch (error) {
                core.warning(`could not post inline suggestions: ${error.message}`);
                inlineFailed = true;
              }
            }

            function doctorSection() {
              const out = [];
              if (posted) {
                out.push(
                  posted === 1
                    ? "🩺 **1 suggested fix** is waiting in **Files changed**. Read it, and if you agree press **Commit suggestion**; the check re-runs on its own."
                    : `🩺 **${posted} suggested fixes** are waiting in **Files changed**, one per problem the doctor could solve. Press **Commit suggestion** on each you agree with (or batch them); the check re-runs on its own.`,
                );
              }
              if (inlineFailed && suggestions.length) {
                out.push("🩺 **Suggested fixes** (they could not be attached to the lines, so here they are in full):");
                for (const s of suggestions) {
                  const where = s.start_line === s.end_line ? `line ${s.start_line}` : `lines ${s.start_line}–${s.end_line}`;
                  out.push("", `**\`${s.path}\`, ${where}** — ${s.why}`, "", "```", s.replacement === "" ? "(delete these lines)" : s.replacement, "```");
                }
              }
              if (notes.length) {
                if (out.length) out.push("");
                out.push("✍️ **Only you can fix these:**", ...notes.map((n) => `- ${n.body}`));
              }
              if (remaining.length) {
                out.push("", "After the suggestions, the check would still say:", ...remaining.map((m) => `- ${m}`));
              }
              return out.join("\n");
            }
            // An empty code means a step before the validator failed: the
            // check did not run, and the contributor must not be told their
            // scene is wrong. Say so, and mark the status as an error, not a
            // failure, so it reads as ours.
            const ran = process.env.VALIDATE_CODE !== "";
            const ok = process.env.VALIDATE_CODE === "0";
            const report = fs.existsSync("report.txt")
              ? fs.readFileSync("report.txt", "utf8").trim() || "(no output)"
              : "(no output)";
            // The validator prints GitHub Actions annotations so problems show
            // inline on the diff; the same text reads badly in a comment. Turn
            // each `::error file=F,line=N::message` into a list item, and let
            // the passing report (plain prose with backticks) render as
            // markdown.
            function asMarkdown(text) {
              const out = [];
              for (const raw of text.split("\n")) {
                const line = raw.trimEnd();
                const m = /^::error (.*?)::(.*)$/.exec(line);
                if (m) {
                  const props = Object.fromEntries(m[1].split(",").map((kv) => kv.split("=")));
                  const where = props.line ? `${props.file}:${props.line}` : props.file;
                  out.push(`- \`${where}\` — ${m[2].replace(/`/g, "'")}`);
                } else if (/^\d+ problem\(s\) found\.$/.test(line)) {
                  continue;
                } else if (line.startsWith("story OK:")) {
                  out.push(`**${line}**`);
                } else {
                  out.push(line);
                }
              }
              return out.join("\n").trim();
            }
            const problems = (report.match(/^::error /gm) || []).length;
            const sha = context.payload.pull_request.head.sha;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              context: "story/validate",
              state: ok ? "success" : ran ? "failure" : "error",
              description: ok
                ? "the film validates"
                : ran
                  ? "the film has problems — see the comment"
                  : "the check could not run; a maintainer will look",
            });

            const marker = "<!-- open-slop:validate -->";
            const body = !ran
              ? [
                  marker,
                  "### ⚠️ The format check could not run",
                  "",
                  "Something failed in the workflow before your scene was looked at. This is on the project, not on you; a maintainer will fix it and the check re-runs by itself. Nothing to do on your side.",
                  "",
                  `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                ].join("\n")
              : [
                  marker,
                  ok ? "### ✅ Format check passed" : `### ❌ Format check found ${problems} problem(s)`,
                  "",
                  asMarkdown(report).slice(0, 50_000),
                  "",
                  ok
                    ? "🗳️ Once enough people approve it (see the **Audience vote** comment) and the wait after your last push has passed, it merges on its own."
                    : [doctorSection(), "🔧 Fix the problems above and push again; this re-runs automatically."]
                        .filter(Boolean)
                        .join("\n\n"),
                ].join("\n");

            // The sticky comment is the bot's own. A contributor who pastes
            // the marker into a comment of theirs is not handing us a comment
            // to overwrite.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user?.login === "github-actions[bot]" && c.body && c.body.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

  branch-tip:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the story tip (data only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: story-tip
          persist-credentials: false

      - name: Fetch the validator from the code branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: 85a3e511f9c269dcdab7fa0e144afa5b85498924
          path: tools
          sparse-checkout: story-tools
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate the whole film at the tip
        id: validate
        run: |
          set +e
          python tools/story-tools/validate.py story-tip > report.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat report.txt

      - name: Open or close the "branch is broken" issue
        if: always()
        uses: actions/github-script@v7
        env:
          VALIDATE_CODE: ${{ steps.validate.outputs.code }}
        with:
          script: |
            const fs = require("fs");
            const ok = process.env.VALIDATE_CODE === "0";
            const report = fs.existsSync("report.txt")
              ? fs.readFileSync("report.txt", "utf8").trim() || "(no output)"
              : "(no output)";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "The story branch does not validate";
            const marker = "<!-- open-slop:branch-tip -->";
            // Same rendering as the pull-request comment: annotations become
            // list items.
            function asMarkdown(text) {
              const out = [];
              for (const raw of text.split("\n")) {
                const line = raw.trimEnd();
                const m = /^::error (.*?)::(.*)$/.exec(line);
                if (m) {
                  const props = Object.fromEntries(m[1].split(",").map((kv) => kv.split("=")));
                  const where = props.line ? `${props.file}:${props.line}` : props.file;
                  out.push(`- \`${where}\` — ${m[2].replace(/`/g, "'")}`);
                } else if (!/^\d+ problem\(s\) found\.$/.test(line)) {
                  out.push(line);
                }
              }
              return out.join("\n").trim();
            }

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", creator: "github-actions[bot]", per_page: 100,
            });
            const existing = open.find((i) => !i.pull_request && i.body && i.body.includes(marker));

            if (ok) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: `Fixed at ${context.sha.slice(0, 7)} — the film validates again.`,
                });
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: "closed" });
              }
              return;
            }

            const body = [
              marker,
              `The tip of \`story\` (${context.sha.slice(0, 7)}) fails the format check. Two pull requests`,
              "that each passed on their own have merged into a film that does not validate.",
              "The projector keeps airing the last good film until this is fixed; open a pull",
              "request that repairs the branch and vote it in.",
              "",
              asMarkdown(report).slice(0, 60_000),
            ].join("\n");
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
